<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VizMaker</title>

<!-- ====== KONFIGURACJA ====== -->
<script>
  var GA_ID = 'G-00QC63JGWS';   // GA4: VizMaker Viewer (Ads)

  // Tutorial (popup). TUTORIAL_VIDEO = ID filmu z YouTube (część po v= lub youtu.be/), puste = tylko link do kanału.
  var TUTORIAL = {
    video:   '',                                        // np. 'dQw4w9WgXcQ'
    channel: 'https://www.youtube.com/@vizmaker-ai',
    title:   'Full tutorial: how to use this project in VizMaker',
    delaySec: 15                                        // auto-popup po X s (0 = wyłączony)
  };

  // Projekty pokazowe pod reklamy. W linku reklamy: ?p=kuchnia (bez ?p = 'default')
  var PROJECTS = {
    'default': {
      desktop: 'https://viewer.svc.vizmaker.com/projectviewer?token=YGUejv3XWkASVC86RyQH2BbWrVcmpVhT',
      mobile:  'https://viewer.svc.vizmaker.com/projectviewer?token=YGUejv3XWkASVC86RyQH2BbWrVcmpVhT'
    },
    'live': {   // Live Preview VizMaker
      desktop: 'https://viewer.svc.vizmaker.com/projectviewer?token=I7eatiV64hSWBtoxxOMYQbiyKAKaiKWo',
      mobile:  'https://viewer.svc.vizmaker.com/projectviewer?token=I7eatiV64hSWBtoxxOMYQbiyKAKaiKWo'
    }
    // ,'kuchnia': { desktop: 'https://...token=AAA', mobile: 'https://...token=BBB' }
  };
</script>
<!-- ========================== -->

<script>
  var qs = new URLSearchParams(location.search);
  var projectKey = PROJECTS[qs.get('p')] ? qs.get('p') : 'default';
  var isMobile = window.matchMedia('(max-width: 768px)').matches ||
                 /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var device = isMobile ? 'mobile' : 'desktop';

  // GA4 (UTM-y i gclid z linku reklamy GA4 łapie automatycznie)
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  var P = { project: projectKey, device_layout: device };   // dołączane do każdego eventu
  gtag('config', GA_ID);
  gtag('event', 'viewer_open', P);   // otwarcie viewera z projektem i urządzeniem

  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
</script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f14; }
  iframe {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    border: 0; display: block;
  }
  #tut-btn {
    position: fixed; left: 84px; bottom: 112px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(17,24,32,.92); color: #fff; font: 600 14px/1 system-ui, sans-serif;
    cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.35); backdrop-filter: blur(6px);
  }
  #tut-btn:hover { background: #1f2c38; }
  #tut-btn .dot { width: 22px; height: 22px; border-radius: 50%; background: #ff0033;
    display: grid; place-items: center; font-size: 10px; }
  #tut-overlay { position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; }
  #tut-overlay.open { display: flex; }
  #tut-box { width: min(860px, 100%); background: #111820; color: #fff; border-radius: 14px;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); font-family: system-ui, sans-serif; }
  #tut-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; }
  #tut-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  #tut-close { background: none; border: 0; color: #aab; font-size: 26px; line-height: 1; cursor: pointer; }
  #tut-video { position: relative; aspect-ratio: 16 / 9; background: #000; }
  #tut-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #tut-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; flex-wrap: wrap; }
  .tut-link { padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .tut-yt { background: #ff0033; color: #fff; }
  .tut-later { background: transparent; color: #aab; border: 1px solid #334; cursor: pointer; }
  #tut-nov { padding: 28px 18px; color: #cdd; font-size: 15px; }
  @media (max-width: 768px) {
    #tut-btn { left: 12px; bottom: auto; top: 64px; padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<iframe id="viewer" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
<script>
  // Przekaż parametry reklamy (utm_*, gclid, fbclid...) dalej do viewera,
  // żeby rejestracja w VizMaker też wiedziała, z jakiej reklamy przyszedł user.
  var src = new URL(PROJECTS[projectKey][device]);
  qs.forEach(function (v, k) {
    if (/^(utm_|gclid|gbraid|wbraid|fbclid|ttclid|msclkid)/.test(k)) src.searchParams.set(k, v);
  });
  document.getElementById('viewer').src = src.toString();

  // Czas na stronie / zaangażowanie: event co 15 s, dopóki karta jest aktywna
  var seconds = 0;
  setInterval(function () {
    if (document.visibilityState === 'visible') {
      seconds += 15;
      if ([15, 30, 60, 120].indexOf(seconds) !== -1)
        gtag('event', 'viewer_engaged', Object.assign({ seconds: seconds }, P));
    }
  }, 15000);

  // Opcjonalnie: viewer może wysyłać kliknięcia do wrappera
  // (dev dodaje w viewerze: window.parent.postMessage({vmEvent:'use_click'}, '*'))
  window.addEventListener('message', function (e) {
    if (!/vizmaker\.com$/.test(new URL(e.origin).hostname)) return;
    if (e.data && e.data.vmEvent) gtag('event', e.data.vmEvent, P);
  });
</script>
<button id="tut-btn" type="button"><span class="dot">&#9654;</span>Full tutorial</button>
<div id="tut-overlay" role="dialog" aria-modal="true" aria-labelledby="tut-title">
  <div id="tut-box">
    <div id="tut-head"><h2 id="tut-title"></h2><button id="tut-close" type="button" aria-label="Close">&times;</button></div>
    <div id="tut-body"></div>
    <div id="tut-foot">
      <button class="tut-link tut-later" id="tut-later" type="button">Explore the project</button>
      <a class="tut-link tut-yt" id="tut-yt" target="_blank" rel="noopener">Open on YouTube</a>
    </div>
  </div>
</div>
<script>
  (function () {
    var ov = document.getElementById('tut-overlay'), body = document.getElementById('tut-body');
    var vid = (PROJECTS[projectKey] && PROJECTS[projectKey].tutorial) || TUTORIAL.video;
    var ytUrl = vid ? 'https://www.youtube.com/watch?v=' + vid : TUTORIAL.channel;
    document.getElementById('tut-title').textContent = TUTORIAL.title;
    document.getElementById('tut-yt').href = ytUrl;
    var shown = false;
    try { shown = sessionStorage.getItem('tut_shown') === '1'; } catch (e) {}

    function open(source) {
      body.innerHTML = vid
        ? '<div id="tut-video"><iframe src="https://www.youtube-nocookie.com/embed/' + vid +
          '?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>'
        : '<div id="tut-nov">Watch step-by-step tutorials on our YouTube channel.</div>';
      ov.classList.add('open');
      try { sessionStorage.setItem('tut_shown', '1'); } catch (e) {}
      gtag('event', 'tutorial_open', Object.assign({ source: source }, P));
    }
    function close(how) {
      ov.classList.remove('open'); body.innerHTML = '';   // zatrzymuje film
      gtag('event', 'tutorial_close', Object.assign({ how: how }, P));
    }
    document.getElementById('tut-btn').onclick = function () { open('button'); };
    document.getElementById('tut-close').onclick = function () { close('x'); };
    document.getElementById('tut-later').onclick = function () { close('explore'); };
    ov.addEventListener('click', function (e) { if (e.target === ov) close('backdrop'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('open')) close('esc'); });
    document.getElementById('tut-yt').onclick = function () {
      gtag('event', 'tutorial_youtube_click', Object.assign({ video: vid || 'channel' }, P));
    };
    if (TUTORIAL.delaySec > 0 && !shown) setTimeout(function () {
      if (!ov.classList.contains('open')) open('auto');
    }, TUTORIAL.delaySec * 1000);
  })();
</script>
</body>
</html>
