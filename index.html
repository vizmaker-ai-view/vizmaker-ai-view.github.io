<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VizMaker</title>

<!-- ====== KONFIGURACJA ====== -->
<script>
  var GA_ID = 'G-00QC63JGWS';   // GA4: VizMaker Viewer (Ads)

  // Tutorial (popup): ID filmu YouTube + teksty
  var TUTORIAL = {
    video:    'WRiuqYljDQ4',
    title:    'Turn any 3D scene into a realistic Live Preview',
    subtitle: 'Watch how this project was made in VizMaker, step by step.',
    quickSec: 4,            // popup po X s, jeśli user jeszcze nic nie kliknął w viewerze
    lateSec:  45,           // jeśli user już klika: popup dopiero po X s (0 = nigdy)
    everyDays: 7            // pokazuj automatycznie najwyżej raz na X dni
  };

  // Pasek promo u góry (jak na vizmaker.com)
  var PROMO = {
    on:       true,
    title:    'Nano Banana 2 · 4K · FREE',
    text:     '7 days of unlimited rendering in 4K quality.',
    cta:      'Start free trial',
    ctaShort: 'Try free',
    url:      'https://www.vizmaker.com/?src=viewer',
    delayMs:  1500,
    hideDays: 1             // po zamknięciu (×) wraca po X dniach
  };

  // Projekty pokazowe pod reklamy. W linku reklamy: ?p=kuchnia (bez ?p = 'default')
  var PROJECTS = {
    'default': {
      desktop: 'https://viewer.svc.vizmaker.com/projectviewer?token=YGUejv3XWkASVC86RyQH2BbWrVcmpVhT',
      mobile:  'https://viewer.svc.vizmaker.com/projectviewer?token=YGUejv3XWkASVC86RyQH2BbWrVcmpVhT'
    },
    'live': {   // Live Preview VizMaker
      desktop: 'https://viewer.svc.vizmaker.com/projectviewer?token=I7eatiV64hSWBtoxxOMYQbiyKAKaiKWo',
      mobile:  'https://viewer.svc.vizmaker.com/projectviewer?token=I7eatiV64hSWBtoxxOMYQbiyKAKaiKWo'
    }
    // ,'kuchnia': { desktop: 'https://...token=AAA', mobile: 'https://...token=BBB' }
  };
</script>
<!-- ========================== -->

<script>
  var qs = new URLSearchParams(location.search);
  var projectKey = PROJECTS[qs.get('p')] ? qs.get('p') : 'default';
  var isMobile = window.matchMedia('(max-width: 768px)').matches ||
                 /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var device = isMobile ? 'mobile' : 'desktop';

  // GA4 (UTM-y i gclid z linku reklamy GA4 łapie automatycznie)
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  var P = { project: projectKey, device_layout: device };   // dołączane do każdego eventu
  gtag('config', GA_ID);
  gtag('event', 'viewer_open', P);   // otwarcie viewera z projektem i urządzeniem

  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
</script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f14; }
  iframe {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    border: 0; display: block;
  }
  :root { --vm-teal: #4fe3d8; --vm-teal-d: #2bbdb3; --vm-bg: #0e1418; --vm-line: rgba(255,255,255,.09); }
  #tut-btn {
    position: fixed; left: 84px; bottom: 112px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 16px 7px 7px; border-radius: 999px;
    background: rgba(14,20,24,.88); border: 1px solid var(--vm-line);
    color: #e9f4f3; font: 600 13.5px/1 Inter, system-ui, -apple-system, sans-serif; letter-spacing: .1px;
    cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(0,0,0,.45);
    transition: transform .15s ease, border-color .15s ease;
  }
  #tut-btn:hover { transform: translateY(-1px); border-color: rgba(79,227,216,.5); }
  #tut-btn .ic { position: relative; width: 30px; height: 30px; border-radius: 50%;
    background: var(--vm-teal); display: grid; place-items: center; }
  #tut-btn .ic svg { width: 12px; height: 12px; margin-left: 2px; fill: #071214; }
  #tut-btn .ic::after { content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--vm-teal); opacity: 0; animation: tutPulse 2.4s ease-out infinite; }
  @keyframes tutPulse { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
  #tut-btn small { display: block; font-weight: 500; font-size: 11px; color: #8fa3a6; margin-top: 3px; }

  #tut-overlay { position: fixed; inset: 0; z-index: 20; display: none; padding: 20px;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(5,10,12,.55), rgba(5,10,12,.82)); backdrop-filter: blur(3px); }
  #tut-overlay.open { display: flex; animation: tutFade .2s ease; }
  @keyframes tutFade { from { opacity: 0; } to { opacity: 1; } }
  #tut-box { position: relative; width: min(760px, 100%); max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, #121a1f, var(--vm-bg)); border: 1px solid var(--vm-line);
    border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(79,227,216,.06) inset;
    color: #e9f4f3; font-family: Inter, system-ui, -apple-system, sans-serif; animation: tutPop .25s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes tutPop { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  #tut-close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--vm-line); background: rgba(255,255,255,.04); color: #9fb2b4; font-size: 20px; line-height: 1;
    cursor: pointer; display: grid; place-items: center; }
  #tut-close:hover { color: #fff; background: rgba(255,255,255,.1); }
  #tut-head { padding: 22px 64px 16px 24px; }
  .tut-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: rgba(79,227,216,.12); color: var(--vm-teal); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .tut-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--vm-teal); }
  #tut-title { margin: 12px 0 6px; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -.2px; }
  #tut-sub { margin: 0; color: #93a7aa; font-size: 14px; line-height: 1.5; }
  #tut-media { position: relative; margin: 0 24px; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
    background: #000; border: 1px solid var(--vm-line); cursor: pointer; }
  #tut-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  #tut-media:hover img { transform: scale(1.03); }
  #tut-media .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.45)); }
  #tut-media .play { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
    background: var(--vm-teal); display: grid; place-items: center; box-shadow: 0 10px 40px rgba(79,227,216,.45); transition: transform .15s ease; }
  #tut-media:hover .play { transform: scale(1.08); }
  #tut-media .play svg { width: 26px; height: 26px; margin-left: 4px; fill: #071214; }
  #tut-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #tut-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 24px 22px; flex-wrap: wrap; }
  .tut-btn2 { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
    font: 600 14px/1 Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
  .tut-ghost { background: transparent; color: #a9bcbe; border-color: var(--vm-line); }
  .tut-ghost:hover { color: #fff; border-color: rgba(255,255,255,.2); }
  .tut-yt { background: var(--vm-teal); color: #071214; }
  .tut-yt:hover { background: var(--vm-teal-d); }
  .tut-yt svg { width: 18px; height: 18px; fill: currentColor; }
  @media (max-width: 768px) {
    #tut-btn { left: 66px; bottom: calc(176px + env(safe-area-inset-bottom)); padding: 5px 12px 5px 5px; font-size: 12.5px; }
    #tut-btn .ic { width: 26px; height: 26px; }
    #tut-btn small { display: none; }
    /* telefon: karta wysuwana od dołu, viewer dalej klikalny */
    #tut-overlay { padding: 0; align-items: flex-end; background: none; backdrop-filter: none; pointer-events: none; }
    #tut-box { pointer-events: auto; width: 100%; border-radius: 20px 20px 0 0; max-height: 78vh;
      padding-bottom: env(safe-area-inset-bottom); animation: tutUp .3s cubic-bezier(.2,.9,.3,1); box-shadow: 0 -12px 40px rgba(0,0,0,.6); }
    @keyframes tutUp { from { transform: translateY(100%); } to { transform: none; } }
    #tut-box::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 4px; background: #3a4a4e; margin: 10px auto 0; }
    #tut-close { top: 16px; }
    #tut-head { padding: 10px 56px 12px 18px; }
    #tut-title { font-size: 17px; margin-top: 10px; }
    #tut-sub { font-size: 13px; }
    #tut-media { margin: 0 18px; }
    #tut-foot { padding: 14px 18px 18px; flex-direction: column-reverse; align-items: stretch; gap: 8px; }
    .tut-btn2 { justify-content: center; }
  }
  /* ---- pasek promo ---- */
  :root { --promo-h: 0px; }
  body.has-promo { --promo-h: 56px; }
  #viewer { top: var(--promo-h); height: calc(100vh - var(--promo-h)); height: calc(100dvh - var(--promo-h)); transition: top .35s ease, height .35s ease; }
  #promo { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 15; display: flex; align-items: center;
    gap: 22px; padding: 0 64px 0 28px; box-sizing: border-box; overflow: hidden;
    background: #0a1216; border-bottom: 1px solid rgba(79,227,216,.14);
    font-family: Inter, system-ui, -apple-system, sans-serif; color: #e9f4f3;
    transform: translateY(-100%); transition: transform .35s ease; }
  body.has-promo #promo { transform: none; }
  #promo::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(rgba(79,227,216,.35) 1px, transparent 1.5px);
    background-size: 46px 46px; background-position: 13px 9px;
    -webkit-mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000);
            mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000); }
  #promo .emo { font-size: 24px; line-height: 1; position: relative; }
  #promo .ttl { font-weight: 700; font-size: 16px; color: var(--vm-teal); white-space: nowrap; position: relative; }
  #promo .sep { width: 1px; height: 26px; background: rgba(255,255,255,.12); position: relative; }
  #promo .txt { color: #c9d6d7; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  #promo .go { margin-left: auto; position: relative; display: inline-flex; align-items: center; gap: 10px;
    padding: 0 26px; height: 38px; border-radius: 8px; background: var(--vm-teal); color: #061316;
    font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap;
    box-shadow: 0 0 22px rgba(79,227,216,.35); transition: background .15s ease, transform .15s ease; }
  #promo .go:hover { background: #6ff0e6; transform: translateY(-1px); }
  #promo .go .s { display: none; }
  #promo .x { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
    border: 0; background: none; color: var(--vm-teal); font-size: 24px; line-height: 1; cursor: pointer; opacity: .85; }
  #promo .x:hover { opacity: 1; }
  @media (max-width: 900px) { #promo .sep, #promo .txt { display: none; } }
  @media (max-width: 768px) {
    body.has-promo { --promo-h: 50px; }
    #promo { height: 50px; gap: 10px; padding: 0 44px 0 12px; }
    #promo .emo { font-size: 20px; }
    #promo .ttl { font-size: 13.5px; }
    #promo .go { height: 34px; padding: 0 14px; font-size: 13px; gap: 6px; }
    #promo .go .l { display: none; }
    #promo .go .s { display: inline; }
    #promo .x { right: 6px; font-size: 22px; }
  }
  @media (max-width: 340px) { #promo .ttl { font-size: 12px; } }
</style>
</head>
<body>
<iframe id="viewer" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
<script>
  // Przekaż parametry reklamy (utm_*, gclid, fbclid...) dalej do viewera,
  // żeby rejestracja w VizMaker też wiedziała, z jakiej reklamy przyszedł user.
  var src = new URL(PROJECTS[projectKey][device]);
  qs.forEach(function (v, k) {
    if (/^(utm_|gclid|gbraid|wbraid|fbclid|ttclid|msclkid)/.test(k)) src.searchParams.set(k, v);
  });
  document.getElementById('viewer').src = src.toString();

  // Czas na stronie / zaangażowanie: event co 15 s, dopóki karta jest aktywna
  var seconds = 0;
  setInterval(function () {
    if (document.visibilityState === 'visible') {
      seconds += 15;
      if ([15, 30, 60, 120].indexOf(seconds) !== -1)
        gtag('event', 'viewer_engaged', Object.assign({ seconds: seconds }, P));
    }
  }, 15000);

  // Opcjonalnie: viewer może wysyłać kliknięcia do wrappera
  // (dev dodaje w viewerze: window.parent.postMessage({vmEvent:'use_click'}, '*'))
  window.addEventListener('message', function (e) {
    if (!/vizmaker\.com$/.test(new URL(e.origin).hostname)) return;
    if (e.data && e.data.vmEvent) gtag('event', e.data.vmEvent, P);
  });
</script>
<button id="tut-btn" type="button" aria-label="Watch the video tutorial">
  <span class="ic"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  <span>Watch tutorial<small>Step-by-step video</small></span>
</button>
<div id="tut-overlay" role="dialog" aria-modal="true" aria-labelledby="tut-title">
  <div id="tut-box">
    <button id="tut-close" type="button" aria-label="Close">&times;</button>
    <div id="tut-head">
      <span class="tut-badge"><i></i>Video tutorial</span>
      <h2 id="tut-title"></h2>
      <p id="tut-sub"></p>
    </div>
    <div id="tut-media" role="button" aria-label="Play video"></div>
    <div id="tut-foot">
      <button class="tut-btn2 tut-ghost" id="tut-later" type="button">Explore the project first</button>
      <a class="tut-btn2 tut-yt" id="tut-yt" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
        Watch on YouTube
      </a>
    </div>
  </div>
</div>
<script>
  (function () {
    var ov = document.getElementById('tut-overlay'), media = document.getElementById('tut-media');
    var vid = (PROJECTS[projectKey] && PROJECTS[projectKey].tutorial) || TUTORIAL.video;
    document.getElementById('tut-title').textContent = TUTORIAL.title;
    document.getElementById('tut-sub').textContent = TUTORIAL.subtitle;
    document.getElementById('tut-yt').href = 'https://www.youtube.com/watch?v=' + vid;
    var KEY = 'vm_tut_seen', recent = false;
    try { recent = Date.now() - (+localStorage.getItem(KEY) || 0) < TUTORIAL.everyDays * 864e5; } catch (e) {}

    function thumb() {
      media.innerHTML = '<img alt="" src="https://i.ytimg.com/vi/' + vid + '/maxresdefault.jpg" ' +
        'onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg\'">' +
        '<div class="shade"></div><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
      media.dataset.state = 'thumb';
    }
    function play() {
      if (media.dataset.state === 'play') return;
      media.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid +
        '?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';
      media.dataset.state = 'play';
      gtag('event', 'tutorial_play', P);
    }
    function open(source) {
      thumb(); ov.classList.add('open'); opened = true;
      try { localStorage.setItem(KEY, Date.now()); } catch (e) {}
      gtag('event', 'tutorial_open', Object.assign({ source: source }, P));
    }
    function close(how) {
      ov.classList.remove('open'); media.innerHTML = '';   // zatrzymuje film
      gtag('event', 'tutorial_close', Object.assign({ how: how }, P));
    }
    media.onclick = play;
    document.getElementById('tut-btn').onclick = function () { open('button'); };
    document.getElementById('tut-close').onclick = function () { close('x'); };
    document.getElementById('tut-later').onclick = function () { close('explore'); };
    ov.addEventListener('click', function (e) { if (e.target === ov) close('backdrop'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('open')) close('esc'); });
    document.getElementById('tut-yt').onclick = function () { gtag('event', 'tutorial_youtube_click', P); };

    // Auto-popup: szybko, jeśli user nic nie robi; później, jeśli już klika w viewer
    var interacted = false, timer = null, opened = false;
    function schedule(sec, src) {
      clearTimeout(timer);
      if (sec > 0) timer = setTimeout(function () { if (!ov.classList.contains('open')) open(src); }, sec * 1000);
    }
    function onInteract() {
      if (interacted) return; interacted = true;
      gtag('event', 'viewer_interact', P);
      if (!recent && !opened) schedule(TUTORIAL.lateSec, 'auto_late');
    }
    // klik w viewer przenosi fokus do ramki -> okno dostaje 'blur'
    window.addEventListener('blur', function () {
      setTimeout(function () { if (document.activeElement && document.activeElement.id === 'viewer') onInteract(); }, 0);
    });
    if (!recent) schedule(TUTORIAL.quickSec, 'auto_idle');
  })();
</script>
<div id="promo" role="region" aria-label="Offer">
  <span class="emo">🍌</span>
  <span class="ttl" id="promo-ttl"></span>
  <span class="sep"></span>
  <span class="txt" id="promo-txt"></span>
  <a class="go" id="promo-go" target="_blank" rel="noopener"><span class="l" id="promo-cta"></span><span class="s" id="promo-cta-s"></span> &rarr;</a>
  <button class="x" id="promo-x" type="button" aria-label="Close">&times;</button>
</div>
<script>
  (function () {
    if (!PROMO.on) return;
    var KEY = 'vm_promo_closed', closed = false;
    try { closed = Date.now() - (+localStorage.getItem(KEY) || 0) < PROMO.hideDays * 864e5; } catch (e) {}
    if (closed) return;
    document.getElementById('promo-ttl').textContent = PROMO.title;
    document.getElementById('promo-txt').textContent = PROMO.text;
    document.getElementById('promo-cta').textContent = PROMO.cta;
    document.getElementById('promo-cta-s').textContent = PROMO.ctaShort;
    // link: src=viewer + parametry reklamy (żeby główne GA wiedziało, z jakiej kampanii i projektu)
    var u = new URL(PROMO.url), hasUtm = false;
    qs.forEach(function (v, k) {
      if (/^(utm_|gclid|gbraid|wbraid|fbclid|ttclid|msclkid)/.test(k)) { u.searchParams.set(k, v); if (k === 'utm_source') hasUtm = true; }
    });
    if (hasUtm && !u.searchParams.get('utm_content')) u.searchParams.set('utm_content', projectKey);
    var go = document.getElementById('promo-go');
    go.href = u.toString();
    go.onclick = function () { gtag('event', 'promo_click', P); };
    document.getElementById('promo-x').onclick = function () {
      document.body.classList.remove('has-promo');
      try { localStorage.setItem(KEY, Date.now()); } catch (e) {}
      gtag('event', 'promo_close', P);
    };
    setTimeout(function () {
      document.body.classList.add('has-promo');
      gtag('event', 'promo_view', P);
    }, PROMO.delayMs);
  })();
</script>
</body>
</html>
